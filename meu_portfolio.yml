services:
  meu_portfolio:
    image: meu_portfolio:latest
    build:
      context: ./meu_portfolio
      dockerfile: Dockerfile
    networks:
      - network_liberica
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.http.routers.meu_portfolio.rule=Host(`copeiro.liberica.pt`)
        - traefik.http.routers.meu_portfolio.entrypoints=websecure
        - traefik.http.routers.meu_portfolio.tls.certresolver=letsencryptresolver
        - traefik.http.services.meu_portfolio.loadbalancer.server.port=80

networks:
  network_liberica:
    external: true
    name: network_liberica
